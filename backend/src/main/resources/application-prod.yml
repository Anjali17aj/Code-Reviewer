server:
  port: ${PORT:8080}
  address: 0.0.0.0

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://code-reviewer-navy-two.vercel.app}

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/codereview}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 25
          batch_versioned_data: true

  data:
    redis:
      url: ${REDIS_URL:}

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

logging:
  level:
    com.codereview: INFO
    org.springframework: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

jwt:
  secret: ${JWT_SECRET}

github:
  client-id: ${GITHUB_CLIENT_ID}
  client-secret: ${GITHUB_CLIENT_SECRET}
  redirect-uri: ${GITHUB_REDIRECT_URI:https://code-reviewer-navy-two.vercel.app/github-callback}

ratelimit:
  max-reviews-per-day: ${RATE_LIMIT_MAX_REVIEWS:50}
  window-hours: ${RATE_LIMIT_WINDOW_HOURS:24}
