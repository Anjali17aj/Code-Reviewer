version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: codereview-mysql
    environment:
      MYSQL_DATABASE: codereview
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${MYSQL_USER:-codereview}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-codereview}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codereview-network

  redis:
    image: redis:7-alpine
    container_name: codereview-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codereview-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codereview-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=jdbc:mysql://mysql:3306/codereview
      - DATABASE_USERNAME=${MYSQL_USER:-codereview}
      - DATABASE_PASSWORD=${MYSQL_PASSWORD:-codereview}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI:-http://localhost:8080/api/github/callback}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - codereview-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codereview-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - codereview-network

volumes:
  mysql_data:
  redis_data:

networks:
  codereview-network:
    driver: bridge
